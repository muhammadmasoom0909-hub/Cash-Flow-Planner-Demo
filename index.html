account:async(f,v)=>{const id=f.dataset.id,old=state.accounts.find(a=>a.id===id),hasTx=old&&state.transactions.some(t=>t.postings.some(p=>p.accountId===id));const type=hasTx?old.type:v.type,opening=hasTx?old.opening:parseAmount(v.opening,true),startDate=hasTx?old.startDate:fieldDate(v.startDate);if(startDate>E.today())throw Error('The starting balance date must be today or earlier.');if(v.last4&&!/^\d{4}$/.test(v.last4))throw Error('Enter exactly four digits, or leave this optional field blank.');if(type==='Credit Card'&&v.include)throw Error('Credit cards are liabilities. Turn off Include in cash flow.');if(!v.name.trim())throw Error('Enter an account name.');await save(s=>{const a={id:id||E.id(),name:v.name.trim(),type,opening,startDate,include:!!v.include&&type!=='Credit Card',institution:v.institution,last4:v.last4,notes:v.notes,archived:old?.archived||false};const i=s.accounts.findIndex(x=>x.id===id);if(i<0)s.accounts.push(a);else s.accounts[i]=a;s.settings.onboarded=true},'Account saved')},
movement:async(f,v)=>{const original=state.transactions.find(t=>t.id===f.dataset.id),occ=f.dataset.occurrence?getEvent(f.dataset.occurrence):null;const actual=(f.dataset.id||occ)?f.dataset.actual==='true':v.mode==='actual';const direction=v.direction||f.dataset.direction;const data={...v,id:f.dataset.id||undefined,direction,amount:parseAmount(v.amount),date:fieldDate(v.date),title:v.title.trim(),stillExpected:!!v.stillExpected};if(data.amount<=0)throw Error('Enter an amount greater than zero.');if(!data.title)throw Error('Enter a description.');if(actual&&direction==='out'&&!data.categoryId)throw Error('Choose a category for this outflow.');E.checkExpected(state,data);checkEntryCategory(data,original||occ||(f.dataset.id?state.movements.find(m=>m.id===f.dataset.id):null));await save(s=>{if(actual){const t=E.record(s,data,occ);if(original?.occurrenceId){t.occurrenceId=original.occurrenceId;t.expectedAmount=original.expectedAmount;t.expectedDate=original.expectedDate}if(occ){setException(s,occ.id,{title:occ.title,amount:occ.amount,date:occ.date,accountId:occ.accountId,categoryId:occ.categoryId});if(v.useNext){const d=s.definitions.find(d=>d.id===occ.sourceId);if(d){E.events(s,E.day(E.today(),s.settings.generationDays)).filter(e=>e.sourceId===d.id&&(e.actual||e.date<=E.today())).forEach(e=>setException(s,e.id,{amount:e.amount,date:e.date,title:e.title}));d.amount=data.amount}}}}else{const i=s.movements.findIndex(x=>x.id===data.id);data.id=data.id||E.id();if(i<0)s.movements.push(data);else s.movements[i]=data}},actual?'Actual movement recorded; balances updated.':'Expected movement saved; current cash unchanged.')},
event:async(f,v)=>{const amount=parseAmount(v.amount);if(amount<=0)throw Error('Enter an amount greater than zero.');fieldDate(v.date);const original=getEvent(f.dataset.id);if(!original)throw Error('This entry is no longer available.');const next={...original,...v,amount};E.checkExpected(state,next);checkEntryCategory(next,original);await save(s=>setException(s,f.dataset.id,{...v,amount,stillExpected:!!v.stillExpected}),'Expected occurrence updated')},
definition:async(f,v)=>{const id=f.dataset.id,old=state.definitions.find(d=>d.id===id),kind=f.dataset.kind,amount=parseAmount(v.amount);if(amount<=0)throw Error('Enter an amount greater than zero.');let anchor=fieldDate(v.anchor),trialEnd='';if(v.direction!=='transfer'&&!v.categoryId)throw Error('Choose a category.');E.checkExpected(state,v);checkEntryCategory(v,old);if(v.endDate){fieldDate(v.endDate);if(v.endDate<anchor)throw Error('The end date must be on or after the first due date.')}if(kind==='subscription'&&v.trial!=='none'){fieldDate(v.trialStart);trialEnd=v.trial==='custom'?fieldDate(v.trialEnd):E.month(v.trialStart,Number(v.trial));if(trialEnd<v.trialStart)throw Error('Trial end must not be before its start.');if(anchor<trialEnd)anchor=trialEnd}if(v.direction==='transfer'&&(!v.accountId||!v.toAccountId||v.accountId===v.toAccountId))throw Error('Choose two different transfer accounts.');const scheduleChanged=old&&(old.anchor!==anchor||old.frequency!==v.frequency);if(scheduleChanged&&anchor<E.today())throw Error('Use a new next due date today or later when changing a schedule.');await save(s=>{if(old)E.retainScheduleHistory(s,id);const d={id:id||E.id(),title:v.title.trim(),amount,anchor,frequency:v.frequency,direction:v.direction,accountId:v.accountId,toAccountId:v.toAccountId||'',categoryId:v.categoryId,notes:v.notes,endDate:v.endDate||'',kind,status:old?.status||'active',trialStart:v.trialStart||'',trialEnd};const i=s.definitions.findIndex(x=>x.id===id);if(i<0)s.definitions.push(d);else s.definitions[i]=d},'Schedule saved')},
resume:async(f,v)=>{const next=fieldDate(v.next);if(next<E.today())throw Error('Choose a next date today or later.');await save(s=>{const d=s.definitions.find(d=>d.id===f.dataset.id);E.retainScheduleHistory(s,d.id);d.anchor=next;d.status='active';d.resumeFrom=next},'Schedule resumed')},
reconcile:async(f,v)=>{const a=state.accounts.find(a=>a.id===f.dataset.id),actual=parseAmount(v.balance,true),diff=actual-E.balance(state,a.id);if(!diff){closeModal();toast('Your balance already matches.');return}form('Confirm balance adjustment','adjustment',input('accountId','Account',a.id,'hidden')+input('amount','Signed difference*',plain(diff),'text',true)+input('date','Adjustment date*',E.today(),'date',true)+input('title','Reason*',v.reason,'text',true),'App: '+fmt(E.balance(state,a.id))+' → actual: '+fmt(actual)+'. This adjustment is not income or spending.','','Create adjustment')},
adjustment:async(f,v)=>{const delta=parseAmount(v.amount,true),date=fieldDate(v.date),a=state.accounts.find(a=>a.id===v.accountId);if(!delta)throw Error('The adjustment must not be zero.');if(!a||date<a.startDate||date>E.today())throw Error('Choose a date from the account start through today.');await save(s=>{const t={id:f.dataset.id||E.id(),title:v.title,date,amount:Math.abs(delta),direction:delta>0?'in':'out',accountId:a.id,postings:[{accountId:a.id,delta}],expense:0,kind:'adjustment',occurrenceId:'',expectedAmount:null,expectedDate:'',notes:v.title};const i=s.transactions.findIndex(t=>t.id===f.dataset.id);if(i<0)s.transactions.push(t);else s.transactions[i]=t},'Balance adjustment recorded')},
snapshot:async(f,v)=>{await save(s=>{const forecast=E.forecast(s,v.horizon);s.snapshots.push({...E.clone(forecast),id:E.id(),name:v.name.trim(),createdAt:new Date().toISOString(),poolIds:E.poolIds(s),currency:s.settings.currency,transactionsAtSnapshot:s.transactions.map(t=>t.id)})},'Forecast snapshot saved')},
'new-scenario':async(f,v)=>{scenarioId=E.id();await save(s=>s.scenarios.push({id:scenarioId,name:v.name,changes:[]}), 'Scenario created')},
'rename-scenario':async(f,v)=>save(s=>s.scenarios.find(s=>s.id===scenarioId).name=v.name,'Scenario renamed'),
'scenario-change':async(f,v)=>{let patch={},label='';if(v.action==='add'){if(!v.title?.trim()||!v.amount||!v.date)throw Error('Add a description, amount and date for this new scenario movement.');patch={title:v.title,amount:parseAmount(v.amount),date:fieldDate(v.date),direction:v.direction,accountId:v.accountId,categoryId:'',notes:'Scenario movement'};if(patch.amount<=0)throw Error('Enter an amount greater than zero.')}else{const e=getEvent(v.target);if(!e||e.actual||e.skipped)throw Error('Choose an active expected event.');label=e.title;if(v.amount){patch.amount=parseAmount(v.amount);if(patch.amount<=0)throw Error('Enter an amount greater than zero.')}if(v.date)patch.date=fieldDate(v.date);if(v.title)patch.title=v.title;if(v.action==='edit'&&!Object.keys(patch).length)throw Error('Enter a changed amount, date or description.')}if(patch.date&&patch.date<E.today())throw Error('Use today or a future date for a what-if change.');await save(s=>{const sn=s.scenarios.find(s=>s.id===scenarioId);if(v.action!=='add'&&sn.changes.some(c=>c.target===v.target))throw Error('This event already has a scenario change. Remove it before adding another.');sn.changes.push({id:E.id(),action:v.action,target:v.target,label,patch})},'What-if change saved')},
category:async(f,v)=>{if(!v.name.trim())throw Error('Enter a category name.');await save(s=>{const c=s.categories.find(c=>c.id===f.dataset.id);if(c)Object.assign(c,{name:v.name,kind:v.kind});else s.categories.push({id:E.id(),name:v.name,kind:v.kind,archived:false})},'Category saved')},
settings:async(f,v)=>{if('currency'in v&&v.currency!==state.settings.currency){try{await resetDemo(v.currency);toast('Sample demo restarted in the selected currency. Amounts were not converted.')}catch(e){showError(e.message)}return}await save(s=>{for(const k of ['language','numberFormat','dateFormat','theme','text','horizon','dashboardHorizon'])if(k in v)s.settings[k]=v[k];for(const k of ['weekStart','generationDays','reminderDays','backupDays'])if(k in v)s.settings[k]=Number(v[k]);if('buffer'in v){s.settings.buffer=v.buffer===''?null:parseAmount(v.buffer);if(s.settings.buffer!==null&&s.settings.buffer<0)throw Error('Use a non-negative buffer.')}if(f.querySelector('[name="notifications"]'))s.settings.notifications=!!v.notifications;if(f.querySelector('[name="reducedMotion"]'))s.settings.reducedMotion=!!v.reducedMotion},'Preferences saved');horizon=state.settings.horizon;render()},

document.addEventListener('click',async ev=>{const dateField=ev.target.closest('.report-range .field');if(dateField){const dateInput=dateField.querySelector('input[type="date"]');if(dateInput&&!dateInput.disabled){dateInput.focus();if(typeof dateInput.showPicker==='function'){try{dateInput.showPicker()}catch(_){/* Native date control remains available. */}}}return}const el=ev.target.closest('button,[data-action]');if(!el)return;if(el.dataset.route){go(el.dataset.route);return}const action=el.dataset.action;if(!action||!ACTIONS[action])return;ev.preventDefault();if(busy||securityBusy)return;if(security&&!unlocked&&!['recover','use-pin','locked-reset','close'].includes(action))return;try{await ACTIONS[action](el)}catch(e){showError(e.message)}});
document.addEventListener('submit',async ev=>{const f=ev.target;if(!f.matches('form[data-form]'))return;ev.preventDefault();if(busy||securityBusy||f.dataset.saving)return;if(security&&!unlocked&&!['unlock','recover','locked-reset'].includes(f.dataset.form))return;const v=Object.fromEntries(new FormData(f));const submit=f.querySelector('button:not([type="button"])');f.dataset.saving='yes';if(submit)submit.disabled=true;try{await FORMS[f.dataset.form]?.(f,v)}catch(e){showError(e.message)}finally{delete f.dataset.saving;if(submit)submit.disabled=false}});
document.addEventListener('change',async ev=>{const el=ev.target;if(security&&!unlocked)return;try{if(el.name==='reportPreset'){const today=E.today();let from,to=today;if(el.value==='month')from=today.slice(0,7)+'-01';else if(el.value==='last-month'){to=E.day(today.slice(0,7)+'-01',-1);from=to.slice(0,7)+'-01'}else if(el.value==='year')from=today.slice(0,4)+'-01-01';else if(['30','90'].includes(el.value))from=E.day(today,1-Number(el.value));if(from){$('f-from').value=from;$('f-to').value=to}}else if(el.dataset.notifyStep){await changeNotificationStep(el.dataset.key,el.dataset.notifyStep,el.checked)}else if(el.name==='action'&&el.closest('form')?.dataset.form==='scenario-change'){scenarioChange(el.value)}else if(el.dataset.change==='dashboard-horizon'){await commit(s=>s.settings.dashboardHorizon=el.value);render()}else if(el.dataset.change==='horizon'){horizon=el.value;render()}else if(el.name==='scenarioSelect'){scenarioId=el.value;render()}else if(el.name==='jumpDate'&&el.value){calendarMonth=el.value.slice(0,7);render();dayAgenda(el.value)}else if(el.name==='mode'){const field=$('f-accountId');if(field&&el.value==='actual'&&!state.accounts.length){showError('Add an account before recording actual money.');el.value='expected'}else if(field){field.innerHTML=accountOptions(el.value!=='actual').map(([id,label])=>'<option value="'+esc(id)+'">'+esc(label)+'</option>').join('')}}else if(el.name==='type'&&el.value==='Credit Card'){const cb=$('overlay').querySelector('[name="include"]');if(cb)cb.checked=false}else if(el.name==='direction'){refreshEntryDirection(el.value)} }catch(e){showError(e.message)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){const panel=document.querySelector('.money-filter-disclosure[open]');if(panel){panel.removeAttribute('open');panel.querySelector('summary').focus();return}}const marker=ev.target.closest?.('g[role="button"]');if(marker&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();dayAgenda(marker.dataset.date);return}if(ev.target.matches?.('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(ev.key)){const peers=[...ev.target.parentElement.querySelectorAll('[role="tab"]')],i=peers.indexOf(ev.target),n=ev.key==='Home'?0:ev.key==='End'?peers.length-1:(i+(ev.key==='ArrowRight'?1:-1)+peers.length)%peers.length;ev.preventDefault();peers[n].click();document.querySelectorAll('[role="tab"]')[n]?.focus();return}if(!$('overlay').firstChild)return;if(ev.key==='Escape'){closeModal();return}if(ev.key==='Tab'){const focus=[...$('overlay').querySelectorAll('button,input,select,textarea,a[href]')].filter(e=>!e.disabled&&e.type!=='hidden'&&e.getClientRects().length);if(!focus.length)return;const first=focus[0],last=focus[focus.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
async function init(){try{try{const a=JSON.parse(localStorage.getItem('ledgerbloom-demo-cash-flow-appearance')||'null');if(a){document.body.classList.toggle('dark',a.theme==='dark'||a.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.style.setProperty('--scale',({small:.94,medium:1,large:1.12,xlarge:1.24})[a.text]||1)}}catch{}db=await openDB();if(sessionStorage.getItem(DEMO_SESSION_KEY)!=='active'){await resetDemo()}else{state=await readState();if(!state.accounts.length)await resetDemo();else{E.validate(state);security=null;unlocked=true;horizon=state.settings.horizon;render()}}matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>applyTheme());window.addEventListener('focus',async()=>{if(busy||securityBusy)return;try{const next=await readState();if(next.revision!==state.revision){state=next;closeModal();render();toast('Workspace refreshed from another tab.')}}catch{}})}catch(e){$('app').innerHTML='<div class="card pad" style="max-width:650px;margin:15vh auto"><div class="eyebrow">LEDGERBLOOM STUDIO</div><h1 class="gap">Your workspace could not open.</h1><p class="subtitle">'+esc(e.message)+'</p><div class="notice gap">This interactive demo needs browser storage. Please use a current browser with IndexedDB enabled and reload the page.</div></div>'}}
init();
