function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('ledgerbloom-demo-cash-flow-planner',2);let blocked=false;req.onupgradeneeded=()=>{const d=req.result,tx=req.transaction;if(!d.objectStoreNames.contains('workspace'))d.createObjectStore('workspace');if(!d.objectStoreNames.contains('security'))d.createObjectStore('security');for(const name of COLLECTIONS){if(d.objectStoreNames.contains(name))continue;const store=d.createObjectStore(name,{keyPath:'id'});if(name==='transactions')for(const key of ['date','accountId','categoryId','kind','occurrenceId'])store.createIndex(key,key);if(name==='movements')for(const key of ['date','accountId'])store.createIndex(key,key);if(name==='definitions')for(const key of ['kind','status'])store.createIndex(key,key);if(name==='snapshots')store.createIndex('createdAt','createdAt')}if(d.objectStoreNames.contains('meta')){const old=tx.objectStore('meta').get('workspace');old.onsuccess=()=>{if(!old.result)return;const meta=old.result,pin=meta.settings?.pin;if(pin){tx.objectStore('security').put({salt:pin.salt,pinHash:pin.hash,recoveryHash:pin.recoveryHash,iterations:150000,legacy:true,attempts:0,retryAt:0,revision:1},'config')}delete meta.settings.pin;tx.objectStore('workspace').put(meta,'workspace');tx.objectStore('meta').delete('workspace')}}};req.onerror=()=>reject(Error('The app could not open local storage. Check browser permissions and reopen the app. Your saved data was not reset.'));req.onblocked=()=>{blocked=true;reject(Error('Close other planner tabs, then reopen this app to finish the storage upgrade.'))};req.onsuccess=()=>{if(blocked){req.result.close();return}req.result.onversionchange=()=>{req.result.close();unlocked=false;closeModal();$('app').innerHTML='<div class="card pad lock"><h1>'+translateUI('Please reopen this app.')+'</h1><p>'+translateUI('Storage was updated in another tab.')+'</p></div>'};resolve(req.result)}})}

async function commit(mutator,message='Saved'){requireUnlocked();if(busy||securityBusy)return;busy=true;try{const next=E.clone(state);await mutator(next);delete next.settings.pin;E.validate(next);await new Promise((resolve,reject)=>{const tx=db.transaction(['workspace','security',...COLLECTIONS],'readwrite'),meta=tx.objectStore('workspace');let conflict=false;const secReq=tx.objectStore('security').get('config');secReq.onsuccess=()=>{if(securitySignature(secReq.result)!==securitySignature(security)){conflict=true;tx.abort();return}const req=meta.get('workspace');req.onsuccess=()=>{if(req.result&&req.result.revision!==state.revision){conflict=true;tx.abort();return}next.revision=(state.revision||0)+1;meta.put({schemaVersion:next.schemaVersion,revision:next.revision,settings:next.settings},'workspace');for(const name of COLLECTIONS){const store=tx.objectStore(name),old=new Map((req.result?state[name]:[]).map(x=>[x.id,x])),present=new Set(next[name].map(x=>x.id));old.forEach((v,id)=>{if(!present.has(id))store.delete(id)});next[name].forEach(x=>{if(!old.has(x.id)||JSON.stringify(old.get(x.id))!==JSON.stringify(x))store.put(x)})}};};tx.oncomplete=resolve;tx.onabort=()=>reject(Error(conflict?'Data changed in another tab. Reopen this planner before retrying.':'Storage could not save. Existing data is unchanged; check available device space.'));tx.onerror=()=>reject(tx.error)});state=next;return true}finally{busy=false}}
async function save(mutator,message='Saved'){try{if(await commit(mutator,message)){closeModal();render();toast(message)}}catch(e){showError(e.message)}}
function applyTheme(){const theme=state.settings.theme;document.body.classList.toggle('dark',theme==='dark'||theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.body.classList.toggle('reduce',state.settings.reducedMotion);document.documentElement.style.setProperty('--scale',({small:.94,medium:1,large:1.12,xlarge:1.24})[state.settings.text]||1);try{localStorage.setItem('ledgerbloom-demo-cash-flow-appearance',JSON.stringify({theme,text:state.settings.text}))}catch{}}
function go(r){route=r;tab=({plan:'Current Forecast',money:'Inflows',bills:'Bills',accounts:'Cash Position',calendar:'Month',reports:'Cash Flow Overview'})[r]||'';query={};page=1;closeModal();render();window.scrollTo(0,0)}
function horizonSelect(v,action='horizon'){return '<select class="select" aria-label="Forecast horizon" data-change="'+action+'">'+[['month','Month end'],['30','30 days'],['60','60 days'],['90','90 days']].map(([k,l])=>'<option value="'+k+'" '+(v===k?'selected':'')+'>'+l+'</option>').join('')+'</select>'}

rerie, pas d’une nouvelle dépense."},"Move money with clarity":{"es":"Transfiere con claridad","fr":"Effectuez des virements clairs"},"Track both sides of a transfer together.":{"es":"Registra ambos lados de la transferencia juntos.","fr":"Suivez les deux côtés d’un virement ensemble."},"Compare account balances and review balance corrections.":{"es":"Compara saldos y revisa sus ajustes.","fr":"Comparez les soldes et examinez les corrections."},"Accounts to review":{"es":"Cuentas a revisar","fr":"Comptes à examiner"},"Active accounts":{"es":"Cuentas activas","fr":"Comptes actifs"},"Adjustments this month":{"es":"Ajustes del mes","fr":"Ajustements ce mois-ci"},"Recorded balance corrections":{"es":"Correcciones de saldo registradas","fr":"Corrections de solde enregistrées"},"Net cash adjustment":{"es":"Ajuste neto de caja","fr":"Ajustement net de trésorerie"},"Compare with your real balance":{"es":"Compara con tu saldo real","fr":"Comparez avec votre solde réel"},"A difference becomes an explicit adjustment only after you confirm.":{"es":"La diferencia se registra como ajuste solo tras confirmarla.","fr":"Une différence devient un ajustement uniquement après confirmation."},"Add an account first.":{"es":"Añade una cuenta primero.","fr":"Ajoutez d’abord un compte."},"Timing makes the difference":{"es":"Las fechas marcan la diferencia","fr":"Les dates font la différence"},"See expected and actual movements together, with a clear label for each.":{"es":"Consulta movimientos previstos y reales, claramente identificados.","fr":"Consultez les mouvements prévus et réels, clairement identifiés."},"Monthly agenda":{"es":"Agenda mensual","fr":"Agenda mensuel"},"Click a date to see its details":{"es":"Haz clic en una fecha para ver los detalles","fr":"Cliquez sur une date pour voir les détails"},"A quiet month":{"es":"Un mes tranquilo","fr":"Un mois calme"},"No entered movements for this month.":{"es":"Sin movimientos registrados este mes.","fr":"Aucun mouvement saisi pour ce mois."},"A considered view of your money":{"es":"Una visión detallada de tu dinero","fr":"Une vue réfléchie de vos finances"},"Real records, explainable projections and comparisons that keep their history.":{"es":"Registros reales, previsiones claras y comparaciones con historial.","fr":"Données réelles, prévisions explicables et comparaisons historiques."},"Actual cash inflows":{"es":"Entradas reales de caja","fr":"Entrées réelles de trésorerie"},"Cash entering the selected pool":{"es":"Dinero que entra en las cuentas seleccionadas","fr":"Argent entrant dans les comptes sélectionnés"},"Actual cash outflows":{"es":"Salidas reales de caja","fr":"Sorties réelles de trésorerie"},"Cash leaving the selected pool":{"es":"Dinero que sale de las cuentas seleccionadas","fr":"Argent sortant des comptes sélectionnés"},"Actual net cash flow":{"es":"Flujo neto real","fr":"Flux net réel de trésorerie"},"Excludes balance adjustments":{"es":"Excluye ajustes de saldo","fr":"Hors ajustements de solde"},"Closing cash":{"es":"Efectivo al cierre","fr":"Trésorerie de clôture"},"Cash bridge":{"es":"Conciliación del flujo de caja","fr":"Passage de trésorerie"},"From opening to closing":{"es":"De apertura a cierre","fr":"De l’ouverture à la clôture"},"Opening cash":{"es":"Efectivo de apertura","fr":"Trésorerie d’ouverture"},"Balance adjustments":{"es":"Ajustes de saldo","fr":"Ajustements de solde"},"Cash movement is not spending":{"es":"Mover dinero no es gastar","fr":"Un mouvement de trésorerie n’est pas une dépense"},"Different questions need different totals":{"es":"Cada pregunta necesita su propio total","fr":"À chaque question son total"},"Recorded consumption spending in this period. Credit-card purchases count here when made; repayments and transfers do not count as spending again.":{"es":"Gastos de consumo registrados en este período. Las compras con tarjeta cuentan al realizarse; los reembolsos y transferencias no duplican el gasto.","fr":"Dépenses de consommation enregistrées sur cette période. Les achats par carte comptent à l’achat ; les remboursements et virements ne doublent pas la dépense."},"Historical reports use your currently selected cash pool. Saved forecast comparisons retain the account selection at snapshot time.":{"es":"Los informes históricos usan las cuentas seleccionadas actualmente. Las comparaciones guardadas conservan la selección original.","fr":"Les rapports historiques utilisent les comptes sélectionnés actuellement. Les comparaisons enregistrées conservent la sélection d’origine."},"Actual vs projected":{"es":"Real frente a previsto","fr":"Réel et prévisionnel"},"Save your first forecast snapshot":{"es":"Guarda tu primera instantánea de previsión","fr":"Enregistrez votre premier instantané de prévision"},"A snapshot freezes today’s assumptions for a meaningful comparison later.":{"es":"Una instantánea conserva las hipótesis actuales para compararlas después.","fr":"Un instantané fige les hypothèses actuelles pour une comparaison ultérieure."},"Save snapshot":{"es":"Guardar instantánea","fr":"Enregistrer un instantané"},"Historical cash position":{"es":"Posición histórica de caja","fr":"Trésorerie historique"},"Reliable history is not available for this range":{"es":"No hay historial fiable para este período","fr":"Historique fiable indisponible pour cette période"},"Choose a date on or after the starting dates of all included accounts.":{"es":"Elige una fecha igual o posterior al inicio de todas las cuentas incluidas.","fr":"Choisissez une date égale ou postérieure au début de tous les comptes inclus."},"Lowest cash":{"es":"Efectivo mínimo","fr":"Trésorerie minimale"},"First negative date":{"es":"Primera fecha negativa","fr":"Première date négative"},"None in this period":{"es":"Ninguna en este período","fr":"Aucune sur cette période"},"Largest upcoming outflows":{"es":"Mayores salidas próximas","fr":"Plus grandes sorties à venir"},"Top five cash reductions":{"es":"Las cinco mayores reducciones de caja","fr":"Les cinq principales sorties de trésorerie"},"No expected cash outflows.":{"es":"Sin salidas de caja previstas.","fr":"Aucune sortie de trésorerie prévue."},"Saved forecast history":{"es":"Historial de previsiones guardadas","fr":"Historique des prévisions enregistrées"},"Snapshots stay frozen when you change today’s plan.":{"es":"Las instantáneas no cambian al modificar el plan actual.","fr":"Les instantanés restent figés lorsque vous modifiez le plan actuel."},"No snapshots saved":{"es":"No hay instantáneas guardadas","fr":"Aucun instantané enregistré"},"Save a forecast to preserve your original plan.":{"es":"Guarda una previsión para conservar el plan original.","fr":"Enregistrez une prévision pour conserver votre plan d’origine."},"No change to total cash in your selected pool":{"es":"Sin cambio en el efectivo total seleccionado","fr":"Aucun changement de la trésorerie totale sélectionnée"},"Next":{"es":"Siguiente","fr":"Suivant"},"Previous":{"es":"Anterior","fr":"Précédent"},"Saved scenario":{"es":"Escenario guardado","fr":"Scénario enregistré"},"Baseline":{"es":"Base","fr":"Référence"},"Your real expected plan":{"es":"Tu plan previsto real","fr":"Votre plan prévisionnel réel"},"None in horizon":{"es":"Ninguna en el período","fr":"Aucune sur la période"},"Temporary changes only":{"es":"Solo cambios temporales","fr":"Modifications temporaires uniquement"},"Compare the timeline":{"es":"Comparar cronologías","fr":"Comparer les évolutions"},"Scenario":{"es":"Escenario","fr":"Scénario"},"Scenario changes":{"es":"Cambios del escenario","fr":"Modifications du scénario"},"These do not change your real plan.":{"es":"No modifican tu plan real.","fr":"Elles ne modifient pas votre plan réel."},"Add change":{"es":"Añadir cambio","fr":"Ajouter une modification"},"Add to plan":{"es":"Añadir al plan","fr":"Ajouter au plan"},"Remove":{"es":"Quitar","fr":"Retirer"},"Rename scenario":{"es":"Renombrar escenario","fr":"Renommer le scénario"},"Delete scenario":{"es":"Eliminar escenario","fr":"Supprimer le scénario"},"Bill":{"es":"Factura","fr":"Facture"},"Card activity":{"es":"Actividad de tarjeta","fr":"Activité de carte"},"Card payment":{"es":"Pago de tarjeta","fr":"Paiement de carte"},"Expense":{"es":"Gasto","fr":"Dépense"},"Movement":{"es":"Movimiento","fr":"Mouvement"},"Recurring":{"es":"Recurrente","fr":"Récurrent"},"Subscription":{"es":"Suscripción","fr":"Abonnement"},"Checking":{"es":"Cuenta corriente","fr":"Compte courant"},"Savings":{"es":"Ahorros","fr":"Épargne"},"Cash":{"es":"Efectivo","fr":"Espèces"},"Digital Wallet":{"es":"Monedero digital","fr":"Portefeuille numérique"},"Credit Card":{"es":"Tarjeta de crédito","fr":"Carte de crédit"},"Investment":{"es":"Inversión","fr":"Investissement"},"Other":{"es":"Otro","fr":"Autre"},"Included in current cash and forecasts.":{"es":"Incluido en el efectivo actual y las previsiones.","fr":"Inclus dans la trésorerie actuelle et les prévisions."},"Amount owed. A negative value is a credit balance.":{"es":"Importe adeudado. Un valor negativo es saldo a favor.","fr":"Montant dû. Une valeur négative est un solde créditeur."},"Tracked balance, excluded from current cash.":{"es":"Saldo registrado, excluido del efectivo actual.","fr":"Solde suivi, exclu de la trésorerie actuelle."},"Saved projected closing":{"es":"Cierre previsto guardado","fr":"Clôture prévue enregistrée"},"Saved lowest cash":{"es":"Mínimo de caja guardado","fr":"Trésorerie minimale enregistrée"},"Actual cash at closing":{"es":"Efectivo real al cierre","fr":"Trésorerie réelle à la clôture"},"Closing variance":{"es":"Diferencia al cierre","fr":"Écart à la clôture"},"Comparison uses the same account pool saved with the forecast.":{"es":"La comparación usa las mismas cuentas guardadas con la previsión.","fr":"La comparaison utilise les mêmes comptes que la prévision enregistrée."},"View assumptions & variance":{"es":"Ver hipótesis y diferencias","fr":"Voir les hypothèses et les écarts"},"Actual cash position":{"es":"Posición real de caja","fr":"Trésorerie réelle"},"Recorded account balances, not today’s balance projected backwards":{"es":"Saldos históricos registrados, no el saldo actual aplicado al pasado","fr":"Soldes enregistrés, et non le solde actuel projeté dans le passé"},"Last backup: Not yet created. Backups contain your financial data; keep them private.":{"es":"Última copia: aún no creada. Contiene tus datos financieros; mantenla privada.","fr":"Dernière sauvegarde : pas encore créée. Elle contient vos données financières ; gardez-la privée."},"Transactions CSV":{"es":"Transacciones CSV","fr":"Transactions CSV"},"Inflows CSV":{"es":"Entradas CSV","fr":"Entrées CSV"},"Outflows CSV":{"es":"Salidas CSV","fr":"Sorties CSV"},"Forecast CSV":{"es":"Previsión CSV","fr":"Prévisions CSV"},"Bill CSV":{"es":"Facturas CSV","fr":"Factures CSV"},"Subscription CSV":{"es":"Suscripciones CSV","fr":"Abonnements CSV"},"Accounts CSV":{"es":"Cuentas CSV","fr":"Comptes CSV"},"Scheduled":{"es":"Programado","fr":"Programmé"},"Actual cash so far":{"es":"Efectivo real hasta ahora","fr":"Trésorerie réelle à ce jour"},"Period still open":{"es":"Período aún abierto","fr":"Période encore ouverte"},"Final variance is available after the forecast period ends.":{"es":"La diferencia final estará disponible al terminar el período.","fr":"L’écart final sera disponible à la fin de la période."},"Saved expected inflows":{"es":"Entradas previstas guardadas","fr":"Entrées prévues enregistrées"},"Actual inflows recorded since snapshot":{"es":"Entradas reales desde la instantánea","fr":"Entrées réelles depuis l’instantané"},"Saved expected outflows":{"es":"Salidas previstas guardadas","fr":"Sorties prévues enregistrées"},"Actual outflows recorded since snapshot":{"es":"Salidas reales desde la instantánea","fr":"Sorties réelles depuis l’instantané"},"Actual lowest closing cash so far":{"es":"Mínimo real al cierre hasta ahora","fr":"Trésorerie minimale réelle à la clôture à ce jour"},"Export snapshot CSV":{"es":"Exportar instantánea CSV","fr":"Exporter l’instantané CSV"},"The current balances of accounts included in your cash-flow view. Credit cards are liabilities, not cash.":{"es":"Saldos actuales de las cuentas incluidas. Las tarjetas de crédito son pasivos, no efectivo.","fr":"Soldes actuels des comptes inclus. Les cartes de crédit sont des passifs, pas de la trésorerie."},"Expected vs actual":{"es":"Previsto frente a real","fr":"Prévu et réel"},"Expected means scheduled but not yet happened. Use Record to link a real transaction and replace that expected occurrence in the forecast.":{"es":"Previsto significa programado, pero no realizado. Usa Registrar para vincular una transacción real y sustituir la prevista.","fr":"Prévu signifie programmé mais non réalisé. Utilisez Enregistrer pour lier une transaction réelle et remplacer l’échéance prévue."},"Projected cash":{"es":"Efectivo previsto","fr":"Trésorerie prévue"},"Current cash plus remaining expected inflows minus remaining expected outflows. It does not guess unentered purchases or unexpected money.":{"es":"Efectivo actual más entradas previstas menos salidas previstas. No supone compras no registradas ni dinero inesperado.","fr":"Trésorerie actuelle plus entrées prévues moins sorties prévues. Aucun achat non saisi ni revenu imprévu n’est supposé."},"Cash runway & low point":{"es":"Evolución y mínimo de caja","fr":"Évolution et point bas de trésorerie"},"The daily cash-position timeline shows when cash may become low. The lowest point is the lowest projected end-of-day balance within the horizon.":{"es":"La cronología diaria muestra cuándo puede faltar efectivo. El mínimo es el menor saldo previsto al final de un día del período.","fr":"La chronologie quotidienne montre quand la trésorerie peut baisser. Le point bas est le plus faible solde de fin de journée prévu sur la période."},"Overdue movements":{"es":"Movimientos vencidos","fr":"Mouvements en retard"},"Unpaid outflows stay in the forecast at its start. Overdue income needs confirmation that it is still expected. Reschedule, record or skip to resolve it.":{"es":"Los pagos pendientes se incluyen al inicio de la previsión. Los ingresos vencidos requieren confirmar que aún se esperan. Reprograma, registra u omite para resolverlos.","fr":"Les sorties impayées restent au début de la prévision. Les revenus en retard nécessitent confirmation. Replanifiez, enregistrez ou ignorez pour les résoudre."},"Temporary what-if changes. Your real data changes only when you explicitly choose Add to plan and confirm.":{"es":"Cambios hipotéticos temporales. Los datos reales cambian solo al elegir Añadir al plan y confirmar.","fr":"Modifications hypothétiques temporaires. Les données réelles changent uniquement après Ajouter au plan et confirmation."},"Bills & subscriptions":{"es":"Facturas y suscripciones","fr":"Factures et abonnements"},"A schedule creates expected occurrences. A payment creates one actual transaction. Free trials have no charge until the first paid billing date.":{"es":"Un calendario crea fechas previstas. Un pago crea una transacción real. Las pruebas gratuitas no generan cargos antes de la primera fecha de pago.","fr":"Un échéancier crée des échéances prévues. Un paiement crée une transaction réelle. Les essais gratuits ne sont facturés qu’à la première échéance payante."},"Transfers & cards":{"es":"Transferencias y tarjetas","fr":"Virements et cartes"},"Transfers within the pool do not change total cash. Transfers outside it reduce cash without new spending. Card purchases count as spending; card repayments reduce cash without counting spending again.":{"es":"Las transferencias internas no cambian el efectivo total. Las externas reducen caja sin crear gasto. Las compras con tarjeta son gastos; sus pagos no duplican ese gasto.","fr":"Les virements internes ne changent pas la trésorerie totale. Les virements externes réduisent la trésorerie sans nouvelle dépense. Les achats par carte sont des dépenses ; leur remboursement ne les compte pas deux fois."},"Compare the app balance with your real balance. Find a missing transaction or create an explicit dated adjustment.":{"es":"Compara el saldo de la aplicación con el real. Busca movimientos faltantes o crea un ajuste con fecha.","fr":"Comparez le solde de l’application avec le solde réel. Retrouvez une transaction manquante ou créez un ajustement daté."},"Snapshots & reports":{"es":"Instantáneas e informes","fr":"Instantanés et rapports"},"Save a forecast snapshot before events happen. Its assumptions stay frozen for later comparisons. Incomplete historical balances are labelled unavailable.":{"es":"Guarda una instantánea antes de los movimientos. Sus hipótesis se conservan para comparar. Los saldos históricos incompletos se indican como no disponibles.","fr":"Enregistrez un instantané avant les événements. Ses hypothèses restent figées pour les comparaisons. Les soldes historiques incomplets sont indiqués comme indisponibles."},"Backup & restore":{"es":"Copias y restauración","fr":"Sauvegarde et restauration"},"Download a backup regularly. Restore validates the complete file before replacing data and downloads a safety copy first. CSV exports are for reading, not full restoration.":{"es":"Descarga copias periódicas. La restauración valida el archivo y descarga una copia de seguridad antes de reemplazar los datos. CSV sirve para lectura, no para restauración completa.","fr":"Téléchargez régulièrement une sauvegarde. La restauration valide le fichier et crée une copie de sécurité avant remplacement. Le CSV sert à la consultation, pas à une restauration complète."},"Privacy & PIN":{"es":"Privacidad y PIN","fr":"Confidentialité et PIN"},"Everything operates locally. A PIN is a screen lock, not data encryption. Keep your recovery key separately. Notifications work only while the planner is open.":{"es":"Todo funciona localmente. El PIN bloquea la pantalla, no cifra los datos. Guarda la clave de recuperación aparte. Los avisos funcionan con el planificador abierto.","fr":"Tout fonctionne localement. Le PIN verrouille l’écran, sans chiffrer les données. Gardez la clé de récupération séparément. Les notifications fonctionnent avec le planificateur ouvert."},"Editing & deleting":{"es":"Edición y eliminación","fr":"Modification et suppression"},"Editing recalculates balances from the authoritative transaction. Deleting a linked payment reopens its expected occurrence. Account opening balances apply from their chosen date.":{"es":"Editar recalcula los saldos. Eliminar un pago vinculado reabre su fecha prevista. Los saldos iniciales se aplican desde la fecha elegida.","fr":"La modification recalcule les soldes. Supprimer un paiement lié rouvre son échéance prévue. Les soldes initiaux s’appliquent à partir de la date choisie."},"Offline use":{"es":"Uso sin conexión","fr":"Utilisation hors ligne"},"Extract the entire ZIP and open index.html in a desktop browser that supports local-file IndexedDB. All design and app code are inside index.html. No server, login or network is required.":{"es":"Extrae el ZIP y abre index.html en un navegador compatible con IndexedDB local. Todo está incluido en index.html. No requiere servidor, acceso ni red.","fr":"Extrayez le ZIP et ouvrez index.html dans un navigateur prenant en charge IndexedDB local. Tout est inclus dans index.html. Aucun serveur, connexion ni réseau requis."},"What this forecast includes":{"es":"Qué incluye esta previsión","fr":"Ce que comprend cette prévision"},"Current included account balances, remaining scheduled income, bills, subscriptions, recurring movements and one-time plans. Unassigned expected movements are assumed to enter or leave your cash pool. Credit-card purchases do not reduce liquid cash until payment.":{"es":"Saldos actuales, ingresos pendientes, facturas, suscripciones y movimientos previstos. Los movimientos sin cuenta se incluyen en caja. Las compras con tarjeta reducen el efectivo al pagarse.","fr":"Soldes actuels, revenus restants, factures, abonnements et mouvements prévus. Les mouvements non attribués sont inclus dans la trésorerie. Les achats par carte réduisent la trésorerie au paiement."},"Overdue active outflows are included at forecast start. Overdue inflows are included only after you mark them “still expected”. Same-day events are displayed inflows first; daily totals do not establish the actual time money will arrive. The forecast does not guess unentered purchases, emergencies or income.":{"es":"Las salidas vencidas se incluyen al inicio. Los ingresos vencidos solo al marcarlos como aún previstos. En un día se muestran primero las entradas, sin garantizar su hora. No se suponen compras, emergencias ni ingresos no registrados.","fr":"Les sorties en retard sont incluses au début. Les entrées en retard nécessitent la mention « toujours attendu ». Les entrées d’un même jour sont affichées d’abord, sans garantie horaire. Aucun achat, urgence ou revenu non saisi n’est supposé."},"Your plan, your pace. Forecasts reflect the movements you enter.":{"es":"Tu plan, a tu ritmo. Las previsiones reflejan los movimientos que introduces.","fr":"Votre plan, à votre rythme. Les prévisions reflètent les mouvements saisis."},"Unavailable":{"es":"No disponible","fr":"Indisponible"},"Current PIN":{"es":"PIN actual","fr":"PIN actuel"},"New PIN":{"es":"Nuevo PIN","fr":"Nouveau PIN"},"Confirm PIN":{"es":"Confirmar PIN","fr":"Confirmer le PIN"},"Recovery key":{"es":"Clave de recuperación","fr":"Clé de récupération"},"Keep this recovery key safe":{"es":"Guarda esta clave de recuperación","fr":"Conservez cette clé de récupération"},"This key unlocks your workspace if you forget the PIN. It is shown once. Store it separately from your device.":{"es":"Esta clave desbloquea el espacio si olvidas el PIN. Se muestra una vez. Guárdala aparte del dispositivo.","fr":"Cette clé déverrouille votre espace si vous oubliez le PIN. Elle n’est affichée qu’une fois. Conservez-la séparément de l’appareil."},"Copy key":{"es":"Copiar clave","fr":"Copier la clé"},"I saved the key":{"es":"He guardado la clave","fr":"J’ai enregistré la clé"},"Use matching PINs with 4–8 digits.":{"es":"Usa PIN iguales de 4 a 8 dígitos.","fr":"Utilisez des PIN identiques de 4 à 8 chiffres."},"Current PIN is incorrect.":{"es":"El PIN actual es incorrecto.","fr":"Le PIN actuel est incorrect."},"That PIN is not correct. Try again.":{"es":"El PIN no es correcto. Inténtalo de nuevo.","fr":"Ce PIN est incorrect. Réessayez."},"PIN disabled":{"es":"PIN desactivado","fr":"PIN désactivé"},"This recovery key is not correct.":{"es":"La clave de recuperación no es correcta.","fr":"Cette clé de récupération est incorrecte."},"Recovery successful. PIN disabled.":{"es":"Recuperación correcta. PIN desactivado.","fr":"Récupération réussie. PIN désactivé."},"Saved":{"es":"Guardado","fr":"Enregistré"},"Account saved":{"es":"Cuenta guardada","fr":"Compte enregistré"},"Account updated":{"es":"Cuenta actualizada","fr":"Compte mis à jour"},"Category saved":{"es":"Categoría guardada","fr":"Catégorie enregistrée"},"Category updated":{"es":"Categoría actualizada","fr":"Catégorie mise à jour"},"Forecast snapshot saved":{"es":"Instantánea guardada","fr":"Instantané enregistré"},"Schedule saved":{"es":"Calendario guardado","fr":"Échéancier enregistré"},"Schedule paused":{"es":"Calendario pausado","fr":"Échéancier suspendu"},"Schedule resumed":{"es":"Calendario reanudado","fr":"Échéancier repris"},"Language & display":{"es":"Idioma y visualización","fr":"Langue et affichage"},"Choose English, Spanish or French in General. Interface labels and dates follow your language; your own names and notes stay unchanged. Number format controls amount separators. First day of week controls the calendar layout.":{"es":"Elige inglés, español o francés en General. La interfaz y las fechas usan ese idioma; tus nombres y notas no cambian. El formato numérico controla los separadores y el primer día determina el calendario.","fr":"Choisissez anglais, espagnol ou français dans Général. L’interface et les dates suivent cette langue ; vos noms et notes restent inchangés. Le format numérique contrôle les séparateurs et le premier jour définit le calendrier."},"Notification controls":{"es":"Controles de notificación","fr":"Réglages des notifications"},"Enable each reminder type separately. Choose 5, 3, 2 or 1 day before the due date, due today and overdue. Turning a type off hides its reminders. Turning it on shows new alerts, without restoring old ones. Reminders appear only while the planner is open.":{"es":"Activa cada tipo por separado. Elige 5, 3, 2 o 1 día antes, el día del vencimiento y atrasos. Al desactivar se ocultan los avisos; al activar aparecen solo los nuevos. El planificador debe estar abierto.","fr":"Activez chaque type séparément. Choisissez 5, 3, 2 ou 1 jour avant, le jour de l’échéance et les retards. Désactiver masque les rappels ; réactiver affiche uniquement les nouveaux. Le planificateur doit être ouvert."},"An optional local screen lock for your workspace. PIN protection is off by default.":{"es":"Un bloqueo local opcional para tu espacio. El PIN está desactivado por defecto.","fr":"Un verrouillage local facultatif pour votre espace. Le PIN est désactivé par défaut."},"PIN Protection":{"es":"Protección con PIN","fr":"Protection par PIN"},"Use a 4–8 digit PIN to lock the interface.":{"es":"Usa un PIN de 4 a 8 dígitos para bloquear la interfaz.","fr":"Utilisez un PIN de 4 à 8 chiffres pour verrouiller l’interface."},"Set Up PIN":{"es":"Configurar PIN","fr":"Configurer le PIN"},"Your workspace locks when you reopen or reload the app.":{"es":"Tu espacio se bloquea al volver a abrir o recargar la aplicación.","fr":"Votre espace se verrouille à la réouverture ou au rechargement de l’application."},"Manage Your PIN":{"es":"Gestiona tu PIN","fr":"Gérer votre PIN"},"New Recovery Key":{"es":"Nueva clave de recuperación","fr":"Nouvelle clé de récupération"},"Lock Now":{"es":"Bloquear ahora","fr":"Verrouiller maintenant"},"Turn Off PIN":{"es":"Desactivar PIN","fr":"Désactiver le PIN"},"Save your recovery key outside the app. It can unlock your workspace if you forget your PIN. Without either, the only recovery is resetting the app and restoring a backup.":{"es":"Guarda la clave fuera de la aplicación. Desbloquea el espacio si olvidas el PIN. Sin ninguno de los dos, solo puedes reiniciar y restaurar una copia.","fr":"Conservez la clé hors de l’application. Elle déverrouille l’espace si vous oubliez le PIN. Sans les deux, il faut réinitialiser et restaurer une sauvegarde."},"The PIN is a local app lock, not database encryption. Anyone with access to this browser’s storage or an exported backup may be able to read records.":{"es":"El PIN bloquea la aplicación localmente; no cifra la base de datos. Quien acceda al almacenamiento del navegador o a una copia podría leer los registros.","fr":"Le PIN verrouille l’application localement, sans chiffrer la base. Toute personne accédant au stockage du navigateur ou à une sauvegarde peut potentiellement lire les données."},"Current PIN or Recovery Key":{"es":"PIN actual o clave de recuperación","fr":"PIN actuel ou clé de récupération"},"Confirm New PIN":{"es":"Confirmar nuevo PIN","fr":"Confirmer le nouveau PIN"},"A new recovery key will be shown once. Any previous recovery key will stop working.":{"es":"Se mostrará una nueva clave una sola vez. La anterior dejará de funcionar.","fr":"Une nouvelle clé sera affichée une seule fois. Toute clé précédente cessera de fonctionner."},"Your financial records will remain unchanged.":{"es":"Tus registros financieros no cambiarán.","fr":"Vos données financières resteront inchangées."},"Your private workspace.":{"es":"Tu espacio privado.","fr":"Votre espace privé."},"Enter your PIN to pick up where you left off.":{"es":"Introduce tu PIN para continuar donde lo dejaste.","fr":"Saisissez votre PIN pour reprendre là où vous en étiez."},"Unlock Workspace":{"es":"Desbloquear espacio","fr":"Déverrouiller l’espace"},"Forgot Your PIN?":{"es":"¿Olvidaste tu PIN?","fr":"PIN oublié ?"},"Use PIN Instead":{"es":"Usar PIN","fr":"Utiliser le PIN"},"Use your saved recovery key to unlock the app.":{"es":"Usa tu clave guardada para desbloquear la aplicación.","fr":"Utilisez votre clé enregistrée pour déverrouiller l’application."},"That PIN or recovery key is not correct.":{"es":"El PIN o la clave de recuperación no es correcto.","fr":"Ce PIN ou cette clé de récupération est incorrect."},"Too many attempts. Please wait a minute.":{"es":"Demasiados intentos. Espera un minuto.","fr":"Trop de tentatives. Veuillez patienter une minute."},"Use a numeric PIN with 4–8 digits.":{"es":"Usa un PIN numérico de 4 a 8 dígitos.","fr":"Utilisez un PIN numérique de 4 à 8 chiffres."},"The PINs do not match.":{"es":"Los PIN no coinciden.","fr":"Les PIN ne correspondent pas."},"PIN protection needs a browser with Web Crypto support.":{"es":"La protección con PIN requiere un navegador compatible con Web Crypto.","fr":"La protection par PIN nécessite un navigateur compatible avec Web Crypto."},"PIN protection is not enabled.":{"es":"La protección con PIN no está activada.","fr":"La protection par PIN n’est pas activée."},"PIN protection turned off.":{"es":"Protección con PIN desactivada.","fr":"Protection par PIN désactivée."},"Save Your Recovery Key":{"es":"Guarda tu clave de recuperación","fr":"Enregistrez votre clé de récupération"},"Keep this somewhere private, outside the app. The key is shown now and cannot be retrieved later.":{"es":"Guárdala en un lugar privado fuera de la aplicación. Se muestra ahora y no puede recuperarse después.","fr":"Conservez-la dans un endroit privé hors de l’application. Elle est affichée maintenant et ne pourra pas être récupérée ensuite."},"Any previous recovery key no longer works.":{"es":"Las claves anteriores ya no funcionan.","fr":"Toute clé de récupération précédente ne fonctionne plus."},"The old recovery key will stop working.":{"es":"La clave anterior dejará de funcionar.","fr":"L’ancienne clé de récupération cessera de fonctionner."},"Download Recovery Key":{"es":"Descargar clave de recuperación","fr":"Télécharger la clé de récupération"},"I Saved It":{"es":"Ya la guardé","fr":"Je l’ai enregistrée"},"This key unlocks this browser workspace.":{"es":"Esta clave desbloquea el espacio de este navegador.","fr":"Cette clé déverrouille l’espace de ce navigateur."},"Reset Locked App":{"es":"Reiniciar aplicación bloqueada","fr":"Réinitialiser l’application verrouillée"},"No PIN or recovery key? Reset this app and restore a financial backup. Existing data will be deleted.":{"es":"¿Sin PIN ni clave? Reinicia la aplicación y restaura una copia financiera. Se eliminarán los datos actuales.","fr":"Sans PIN ni clé ? Réinitialisez l’application et restaurez une sauvegarde financière. Les données existantes seront supprimées."},"All Cash Flow Planner data and PIN settings will be deleted. You can restore financial data only if you have a backup.":{"es":"Se eliminarán todos los datos de Cash Flow Planner y el PIN. Solo podrás restaurar los datos si tienes una copia.","fr":"Toutes les données de Cash Flow Planner et les paramètres PIN seront supprimés. Vous ne pourrez restaurer les données qu’avec une sauvegarde."},"Type DELETE to confirm":{"es":"Escribe DELETE para confirmar","fr":"Saisissez DELETE pour confirmer"},"Type DELETE exactly to confirm.":{"es":"Escribe exactamente DELETE para confirmar.","fr":"Saisissez exactement DELETE pour confirmer."},"Type CLEAR to confirm":{"es":"Escribe CLEAR para confirmar","fr":"Saisissez CLEAR pour confirmer"},"Type CLEAR exactly to confirm.":{"es":"Escribe exactamente CLEAR para confirmar.","fr":"Saisissez exactement CLEAR pour confirmer."},"Clear Financial Data":{"es":"Borrar datos financieros","fr":"Effacer les données financières"},"Delete All App Data":{"es":"Eliminar todos los datos","fr":"Supprimer toutes les données"},"Financial records will be deleted. Categories, preferences and PIN protection will remain.":{"es":"Se eliminarán los registros financieros. Se conservarán categorías, preferencias y PIN.","fr":"Les données financières seront supprimées. Les catégories, préférences et le PIN seront conservés."},"Financial data cleared. PIN protection is unchanged.":{"es":"Datos financieros borrados. El PIN no ha cambiado.","fr":"Données financières effacées. La protection PIN est inchangée."},"App data and PIN settings deleted.":{"es":"Datos y configuración PIN eliminados.","fr":"Données et paramètres PIN supprimés."},"Backups contain your records in readable JSON. Store them somewhere private. PIN credentials are not included.":{"es":"Las copias contienen registros en JSON legible. Guárdalas en privado. No incluyen credenciales PIN.","fr":"Les sauvegardes contiennent vos données en JSON lisible. Conservez-les en lieu privé. Les identifiants PIN sont exclus."},"This backup contains security credentials and cannot be imported.":{"es":"Esta copia contiene credenciales de seguridad y no puede importarse.","fr":"Cette sauvegarde contient des identifiants de sécurité et ne peut pas être importée."},"Workspace contains unexpected security fields. Backup was not created.":{"es":"El espacio contiene campos de seguridad inesperados. No se creó la copia.","fr":"L’espace contient des champs de sécurité inattendus. La sauvegarde n’a pas été créée."},"Unlock your workspace first.":{"es":"Desbloquea tu espacio primero.","fr":"Déverrouillez d’abord votre espace."},"Security storage could not be read. Reopen the app and try again.":{"es":"No se pudo leer la seguridad. Abre de nuevo la aplicación e inténtalo.","fr":"Impossible de lire la sécurité. Rouvrez l’application et réessayez."},"Security changed in another tab. Try again.":{"es":"La seguridad cambió en otra pestaña. Inténtalo de nuevo.","fr":"La sécurité a changé dans un autre onglet. Réessayez."},"Security could not be saved. Your previous protection is unchanged.":{"es":"No se pudo guardar la seguridad. La protección anterior no cambia.","fr":"Impossible d’enregistrer la sécurité. Votre protection précédente est inchangée."},"Close other planner tabs, then reopen this app to finish the storage upgrade.":{"es":"Cierra las otras pestañas y vuelve a abrir la aplicación para terminar la actualización.","fr":"Fermez les autres onglets puis rouvrez l’application pour terminer la mise à jour du stockage."},"Please reopen this app.":{"es":"Vuelve a abrir la aplicación.","fr":"Veuillez rouvrir cette application."},"Storage was updated in another tab.":{"es":"El almacenamiento se actualizó en otra pestaña.","fr":"Le stockage a été mis à jour dans un autre onglet."},"Data changed in another tab. Reopen this planner before retrying.":{"es":"Los datos cambiaron en otra pestaña. Abre de nuevo antes de reintentar.","fr":"Les données ont changé dans un autre onglet. Rouvrez le planificateur avant de réessayer."},"Reset failed. Your existing data and PIN protection are unchanged.":{"es":"Falló el reinicio. Tus datos y PIN no han cambiado.","fr":"La réinitialisation a échoué. Vos données et le PIN restent inchangés."},"Use recovery mode to reset the locked app.":{"es":"Usa el modo de recuperación para reiniciar la aplicación bloqueada.","fr":"Utilisez le mode récupération pour réinitialiser l’application verrouillée."},"PIN & Recovery":{"es":"PIN y recuperación","fr":"PIN et récupération"},"PIN protection is optional and off by default. It locks the interface, not the database. Save your recovery key outside the app; replacing it invalidates the old key. Five failed attempts require a one-minute wait, even after reopening. Recovery unlocks your session without turning protection off. Backups exclude PIN credentials. Without a PIN or key, reset the app and restore a financial backup.":{"es":"El PIN es opcional y está desactivado por defecto. Bloquea la interfaz, no cifra la base. Guarda la clave fuera; reemplazarla invalida la anterior. Cinco fallos obligan a esperar un minuto, incluso tras reabrir. Recuperar desbloquea sin desactivar el PIN. Las copias no incluyen credenciales. Sin PIN ni clave, reinicia y restaura una copia.","fr":"Le PIN est facultatif et désactivé par défaut. Il verrouille l’interface, sans chiffrer la base. Gardez la clé à l’extérieur ; la remplacer invalide l’ancienne. Cinq échecs imposent une minute d’attente, même après réouverture. La récupération déverrouille sans désactiver le PIN. Les sauvegardes excluent les identifiants. Sans PIN ni clé, réinitialisez et restaurez une sauvegarde."},"Switch to light theme":{"es":"Cambiar a tema claro","fr":"Passer au thème clair"},"Switch to dark theme":{"es":"Cambiar a tema oscuro","fr":"Passer au thème sombre"},"Theme updated":{"es":"Tema actualizado","fr":"Thème mis à jour"},"Getting started":{"es":"Primeros pasos","fr":"Premiers pas"},"Using the dashboard":{"es":"Uso del panel","fr":"Utilisation du tableau de bord"},"Choose a forecast period at the top. Current cash is available now; projected cash includes pending movements. The lowest point is an end-of-day estimate, not a guaranteed intraday balance. Open Cash Flow Plan to review dates and assumptions.":{"es":"Elige el período arriba. El efectivo actual está disponible; el previsto incluye movimientos pendientes. El mínimo es una estimación de cierre, no un saldo garantizado durante el día. Revisa fechas e hipótesis en el plan.","fr":"Choisissez la période en haut. La trésorerie actuelle est disponible ; la prévision inclut les mouvements en attente. Le point bas estime la fin de journée, sans garantie en cours de journée. Consultez le plan pour les dates et hypothèses."},"Managing your accounts":{"es":"Gestión de cuentas","fr":"Gestion de vos comptes"},"Edit, Reconcile and Activity are on Accounts & Balances. Archive or restore accounts in Settings. Settle the balance and resolve pending schedules before archiving. Only accounts without linked records can be deleted.":{"es":"Editar, Conciliar y Actividad están en Cuentas y saldos. Archiva o restaura en Configuración. Liquida el saldo y resuelve los pendientes antes de archivar. Solo se eliminan cuentas sin registros vinculados.","fr":"Modifier, Rapprocher et Activité sont dans Comptes et soldes. Archivez ou restaurez dans Paramètres. Soldez le compte et résolvez les échéances avant archivage. Seuls les comptes sans données liées peuvent être supprimés."},"Payment buttons":{"es":"Botones de pago","fr":"Boutons de paiement"},"Weekly payments open 2 days before due, fortnightly payments 3 days before, and monthly or longer payments 5 days before. Overdue payments stay available. Recording one occurrence advances the card to its next pending payment; the same occurrence cannot be recorded twice.":{"es":"Los pagos semanales se activan 2 días antes; cada dos semanas, 3; mensuales o mayores, 5. Los vencidos siguen disponibles. Al registrar se pasa al siguiente pago; una fecha no puede registrarse dos veces.","fr":"Les paiements hebdomadaires s’ouvrent 2 jours avant ; toutes les deux semaines, 3 ; mensuels ou plus, 5. Les retards restent accessibles. L’enregistrement passe au prochain paiement ; une échéance ne peut être enregistrée deux fois."},"Calendar and reports":{"es":"Calendario e informes","fr":"Calendrier et rapports"},"Calendar entries are read-only summaries. View entry opens the exact record in its owning section. Date filters apply to Cash Flow Overview and Cash Position Trend. History lists saved forecasts. Save a snapshot before events happen to compare predicted and actual results.":{"es":"El calendario muestra resúmenes de lectura. Ver registro abre la entrada exacta. Los filtros de fechas están en Resumen y Tendencia de caja. Historial muestra previsiones guardadas. Guarda una instantánea antes de los hechos para comparar.","fr":"Le calendrier affiche des résumés en lecture seule. Voir l’entrée ouvre l’enregistrement exact. Les filtres de dates concernent la Vue d’ensemble et la Tendance. L’historique liste les prévisions. Enregistrez un instantané avant les événements pour comparer."},"Reset options":{"es":"Opciones de reinicio","fr":"Options de réinitialisation"},"Clear Financial Data removes records but keeps categories, preferences and PIN protection. Delete All App Data removes the workspace and PIN together after typed confirmation. Neither option affects other finance products.":{"es":"Borrar datos financieros conserva categorías, preferencias y PIN. Eliminar todos los datos borra el espacio y PIN juntos tras confirmación escrita. Ninguna opción afecta a otros productos.","fr":"Effacer les données financières conserve catégories, préférences et PIN. Supprimer toutes les données efface l’espace et le PIN ensemble après confirmation saisie. Aucun autre produit n’est affecté."},"Troubleshooting":{"es":"Solución de problemas","fr":"Dépannage"},"Keep index.html in a stable extracted folder and use the same browser profile. Missing records can mean a different browser or file location, not deleted data. Close other planner tabs if an upgrade is blocked. If storage is unavailable, do not reset; try the original browser and restore a backup only after checking it.":{"es":"Guarda index.html en una carpeta fija y usa el mismo perfil. Si faltan datos, puede ser otro navegador o ubicación. Cierra otras pestañas si se bloquea una actualización. Si falla el almacenamiento, no reinicies: prueba el navegador original y verifica la copia antes de restaurar.","fr":"Gardez index.html dans un dossier stable et utilisez le même profil. Des données absentes peuvent indiquer un autre navigateur ou emplacement. Fermez les autres onglets si une mise à jour est bloquée. Si le stockage échoue, ne réinitialisez pas : essayez le navigateur d’origine et vérifiez la sauvegarde avant restauration."},"The app could not open local storage. Check browser permissions and reopen the app. Your saved data was not reset.":{"es":"No se pudo abrir el almacenamiento local. Comprueba los permisos y vuelve a abrir. Los datos guardados no se reiniciaron.","fr":"Impossible d’ouvrir le stockage local. Vérifiez les autorisations et rouvrez l’application. Vos données n’ont pas été réinitialisées."},"Search planned movements…":{"es":"Buscar movimientos previstos…","fr":"Rechercher des mouvements prévus…"},"Filter planned movements":{"es":"Filtrar movimientos previstos","fr":"Filtrer les mouvements prévus"},"Recovery Key":{"es":"Clave de recuperación","fr":"Clé de récupération"},"Choose category":{"es":"Elegir categoría","fr":"Choisir une catégorie"},"No category needed for transfers":{"es":"Las transferencias no necesitan categoría","fr":"Aucune catégorie nécessaire pour les virements"},"Previously selected":{"es":"Seleccionada anteriormente","fr":"Sélection précédente"},"Primary":{"es":"Navegación principal","fr":"Navigation principale"},"Forecast horizon":{"es":"Período de previsión","fr":"Période de prévision"},"Mobile navigation":{"es":"Navegación móvil","fr":"Navigation mobile"},"Page views":{"es":"Secciones","fr":"Sections"},"Accounts summary":{"es":"Resumen de cuentas","fr":"Résumé des comptes"},"Transfers summary":{"es":"Resumen de transferencias","fr":"Résumé des virements"},"Reconciliation summary":{"es":"Resumen de conciliación","fr":"Résumé du rapprochement"},"Previous month":{"es":"Mes anterior","fr":"Mois précédent"},"Next month":{"es":"Mes siguiente","fr":"Mois suivant"},"Settings sections":{"es":"Secciones de ajustes","fr":"Sections des paramètres"},"Solid: baseline":{"es":"Línea continua: plan base","fr":"Trait plein : plan de référence"},"dashed: scenario":{"es":"Línea discontinua: escenario","fr":"Pointillés : scénario"},"included at forecast start":{"es":"Incluido al inicio de la previsión","fr":"Inclus au début de la prévision"},"today counts as day 1":{"es":"Hoy cuenta como día 1","fr":"Aujourd’hui compte comme premier jour"},"add":{"es":"Añadir","fr":"Ajouter"},"edit":{"es":"Modificar","fr":"Modifier"},"skip":{"es":"Omitir","fr":"Ignorer"},"Linked records exist; archive this account instead.":{"es":"Hay registros vinculados; archiva esta cuenta.","fr":"Des écritures sont liées ; archivez ce compte."},"No bank credentials or full account numbers are needed.":{"es":"No se necesitan credenciales bancarias ni números de cuenta completos.","fr":"Aucun identifiant bancaire ni numéro de compte complet n’est nécessaire."},"Account name":{"es":"Nombre de la cuenta","fr":"Nom du compte"},"Account type":{"es":"Tipo de cuenta","fr":"Type de compte"},"Starting balance":{"es":"Saldo inicial","fr":"Solde initial"},"For a credit card, enter the positive amount owed. A negative cash balance is allowed.":{"es":"Para una tarjeta, introduce la deuda como importe positivo. El saldo de efectivo puede ser negativo.","fr":"Pour une carte de crédit, saisissez la dette en montant positif. Un solde de trésorerie négatif est autorisé."},"Balance as of":{"es":"Saldo a fecha de","fr":"Solde au"},"The opening amount is the starting point before transactions on this date.":{"es":"El saldo inicial se aplica antes de las transacciones de esta fecha.","fr":"Le solde initial précède les opérations de cette date."},"Include this account in cash flow":{"es":"Incluir esta cuenta en el flujo de caja","fr":"Inclure ce compte dans la trésorerie"},"Institution label":{"es":"Entidad financiera","fr":"Établissement financier"},"Last four digits (optional)":{"es":"Últimos cuatro dígitos (opcional)","fr":"Quatre derniers chiffres (facultatif)"},"Expected entries affect your forecast; actual entries affect account balances.":{"es":"Las entradas previstas afectan a la previsión; las registradas afectan a los saldos.","fr":"Les écritures prévues influencent la prévision ; les opérations réelles modifient les soldes."},"Movement status":{"es":"Estado del movimiento","fr":"État du mouvement"},"Income source":{"es":"Fuente de ingresos","fr":"Source de revenus"},"Use a plain number, for example 1250.50.":{"es":"Usa un número sin separadores de miles, por ejemplo 1250.50.","fr":"Utilisez un nombre sans séparateur de milliers, par exemple 1250.50."},"Expected date":{"es":"Fecha prevista","fr":"Date prévue"},"More details":{"es":"Más detalles","fr":"Plus de détails"},"If overdue, this income is still expected":{"es":"Si está vencido, este ingreso sigue pendiente","fr":"En cas de retard, ce revenu est toujours attendu"},"Save movement":{"es":"Guardar movimiento","fr":"Enregistrer le mouvement"},"Description / merchant":{"es":"Descripción / comercio","fr":"Description / commerçant"},"Transfers between your accounts are not earned income or consumption spending.":{"es":"Las transferencias entre tus cuentas no son ingresos ganados ni gastos de consumo.","fr":"Les virements entre vos comptes ne sont ni des revenus gagnés ni des dépenses de consommation."},"Transfer description":{"es":"Descripción de la transferencia","fr":"Description du virement"},"Actual date":{"es":"Fecha real","fr":"Date réelle"},"Record / save actual":{"es":"Registrar / guardar operación real","fr":"Enregistrer l’opération réelle"},"A schedule creates expected occurrences. It never records a payment automatically.":{"es":"Una programación crea movimientos previstos. Nunca registra pagos automáticamente.","fr":"Une récurrence crée des opérations prévues. Elle n’enregistre jamais de paiement automatiquement."},"Bill name":{"es":"Nombre de la factura","fr":"Nom de la facture"},"Expected amount":{"es":"Importe previsto","fr":"Montant prévu"},"Every 6 months":{"es":"Cada 6 meses","fr":"Tous les 6 mois"},"First / next due date":{"es":"Primera / próxima fecha de vencimiento","fr":"Première / prochaine échéance"},"End date (optional)":{"es":"Fecha de finalización (opcional)","fr":"Date de fin (facultative)"},"Service name":{"es":"Nombre del servicio","fr":"Nom du service"},"First / next paid billing date":{"es":"Primera / próxima fecha de cobro","fr":"Première / prochaine date de facturation payante"},"Free trial":{"es":"Prueba gratuita","fr":"Essai gratuit"},"No trial":{"es":"Sin prueba","fr":"Aucun essai"},"Custom end date":{"es":"Fecha de fin personalizada","fr":"Date de fin personnalisée"},"Subscription / trial start":{"es":"Inicio de suscripción / prueba","fr":"Début de l’abonnement / de l’essai"},"Trial end (custom)":{"es":"Fin de prueba (personalizado)","fr":"Fin de l’essai (personnalisée)"},"Movement name":{"es":"Nombre del movimiento","fr":"Nom du mouvement"},"Transfer destination (if transfer)":{"es":"Destino (si es transferencia)","fr":"Destination (en cas de virement)"},"Transfer destination":{"es":"Destino de la transferencia","fr":"Destination du virement"},"Restore a backup":{"es":"Restaurar una copia de seguridad","fr":"Restaurer une sauvegarde"},"Restore replaces this workspace after full validation. A safety backup of the current data will be downloaded first. Only choose a backup created by LedgerBloom Cash Flow Planner.":{"es":"La restauración sustituye este espacio después de validar el archivo. Primero se descargará una copia de los datos actuales. Elige solo una copia de LedgerBloom Cash Flow Planner.","fr":"La restauration remplace cet espace après validation du fichier. Une copie des données actuelles sera d’abord téléchargée. Choisissez uniquement une sauvegarde de LedgerBloom Cash Flow Planner."},"Backup JSON file":{"es":"Archivo JSON de copia de seguridad","fr":"Fichier JSON de sauvegarde"},"Validate backup":{"es":"Validar copia","fr":"Valider la sauvegarde"},"Add a cash movement":{"es":"Añadir un movimiento de dinero","fr":"Ajouter un mouvement d’argent"},"What would you like to add?":{"es":"¿Qué quieres añadir?","fr":"Que souhaitez-vous ajouter ?"},"Expected or received income":{"es":"Ingresos previstos o recibidos","fr":"Revenus prévus ou reçus"},"Planned or paid expense":{"es":"Gasto previsto o pagado","fr":"Dépense prévue ou payée"},"A due date and a clear commitment":{"es":"Un vencimiento y un compromiso claro","fr":"Une échéance et un engagement clair"},"A recurring service or trial":{"es":"Un servicio recurrente o una prueba","fr":"Un servi function translateDynamicUI(value,language){
 const fr=language==='fr',tr=x=>translateUI(x,language);let m;
 if((m=value.match(/^Notifications, (\d+) unread$/)))return fr?'Notifications, '+m[1]+' non lues':'Notificaciones, '+m[1]+' sin leer';
 if((m=value.match(/^Enter a valid amount with up to (\d+) decimal places\.$/)))return fr?'Saisissez un montant valide avec au maximum '+m[1]+' décimales.':'Introduce un importe válido con un máximo de '+m[1]+' decimales.';
 if(/^Invalid backup or record: |^Duplicate or missing identifier in |^Missing .+ records\.$/.test(value))return fr?'Les données sont incomplètes ou incohérentes. Vérifiez les champs et utilisez une sauvegarde valide.':'Los datos están incompletos o son incoherentes. Revisa los campos y utiliza una copia válida.';
 if((m=value.match(/^This is the same plan viewed over (\d+) days, including today\. Changes also appear in the other forecast tabs\.$/)))return fr?'Le même plan sur '+m[1]+' jours, aujourd’hui inclus. Les modifications apparaissent aussi dans les autres vues.':'El mismo plan durante '+m[1]+' días, incluido hoy. Los cambios también aparecen en las otras vistas.';
 if((m=value.match(/^Upcoming (\d+) days and unresolved earlier occurrences$/)))return fr?'Les '+m[1]+' prochains jours et les échéances antérieures non résolues':'Próximos '+m[1]+' días y vencimientos anteriores pendientes';
 if((m=value.match(/^Overdue since (.+) · included at forecast start$/)))return fr?'En retard depuis le '+m[1]+' · inclus au début de la prévision':'Vencido desde '+m[1]+' · incluido al inicio de la previsión';
 if((m=value.match(/^Cash position timeline\. Opening (.+), closing (.+), lowest (.+) on (.+)$/)))return fr?'Évolution de trésorerie. Départ '+m[1]+', clôture '+m[2]+', minimum '+m[3]+' le '+m[4]:'Evolución de efectivo. Inicial '+m[1]+', cierre '+m[2]+', mínimo '+m[3]+' el '+m[4];
 if((m=value.match(/^Review (.+), cash (.+)$/)))return fr?'Voir le '+m[1]+', trésorerie '+m[2]:'Revisar '+m[1]+', efectivo '+m[2];
 if((m=value.match(/^(.+), (\d+) movements$/)))return m[1]+', '+m[2]+(fr?' mouvements':' movimientos');
 if((m=value.match(/^Saved (.+)\. Period (.+)\. Opening cash (.+)\. Projected closing (.+)\.$/)))return fr?'Enregistré le '+m[1]+'. Période '+m[2]+'. Trésorerie initiale '+m[3]+'. Clôture prévue '+m[4]+'.':'Guardado '+m[1]+'. Período '+m[2]+'. Efectivo inicial '+m[3]+'. Cierre previsto '+m[4]+'.';
 if((m=value.match(/^Amount variance (.+) · actual (.+)$/)))return fr?'Écart de montant '+m[1]+' · réalisé le '+m[2]:'Diferencia de importe '+m[1]+' · real '+m[2];
 if((m=value.match(/^(.+) projected on (.+)$/)))return m[1]+(fr?' prévu le ':' previsto el ')+m[2];
 if((m=value.match(/^Original expected amount: (.+) · scheduled (.+)\. Actual amount variance: (.+)\.$/)))return fr?'Montant initial prévu : '+m[1]+' · échéance '+m[2]+'. Écart réel : '+m[3]+'.':'Importe previsto original: '+m[1]+' · programado '+m[2]+'. Diferencia real: '+m[3]+'.';
 if((m=value.match(/^Expected (.+) on (.+)\. Recording replaces this occurrence’s forecast effect\.$/)))return fr?'Prévu : '+m[1]+' le '+m[2]+'. L’enregistrement remplace l’effet prévu de cette échéance.':'Previsto: '+m[1]+' el '+m[2]+'. El registro sustituye el efecto previsto de este vencimiento.';
 if((m=value.match(/^This backup contains (\d+) accounts, (\d+) actual transactions and (\d+) recurring schedules\. Confirm to download a safety copy and replace the current workspace\.$/)))return fr?'Cette sauvegarde contient '+m[1]+' comptes, '+m[2]+' opérations réelles et '+m[3]+' récurrences. Confirmez pour télécharger une copie de sécurité et remplacer l’espace actuel.':'Esta copia contiene '+m[1]+' cuentas, '+m[2]+' operaciones reales y '+m[3]+' programaciones. Confirma para descargar una copia de seguridad y sustituir el espacio actual.';

function notificationSettings(){return '<div class="notification-settings">'+NOTIFY_TYPES.map(([key,label])=>{const p=notificationPref(key),timed=['bill','subscription','recurring','movement'].includes(key);return '<section class="notification-setting"><div class="split"><h3>'+label+'</h3><button type="button" class="notify-switch '+(p.enabled?'on':'')+'" role="switch" aria-checked="'+p.enabled+'" aria-label="'+label+'" data-action="toggle-notification-type" data-key="'+key+'"><span></span><b>'+(p.enabled?'On':'Off')+'</b></button></div>'+(timed?'<div class="notify-stages">'+NOTICE_STEPS.map(([value,label])=>'<label><input type="checkbox" data-notify-step="'+value+'" data-key="'+key+'" '+(p.steps.includes(value)?'checked':'')+' '+(!p.enabled?'disabled':'')+'><span>'+label+'</span></label>').join('')+'</div>':key==='cash'?'<p class="card-note">Projected negative cash and low-buffer alerts.</p>':key==='backup'?'<form data-form="settings" class="actions gap">'+select('backupDays','Backup reminder interval',[[7,'7 days'],[14,'14 days'],[30,'30 days']],state.settings.backupDays)+'<button class="btn">Save interval</button></form>':'<p class="card-note">A monthly reminder to save your forecast.</p>')+'</section>'}).join('')+'</div><p class="card-note gap">Changes save automatically. Reminders appear while this planner is open; no background push notifications.</p>'}
function notificationCandidates(){const today=E.today(),items=[];E.events(state,E.day(today,5)).filter(e=>!e.actual&&!e.skipped).forEach(e=>{const days=Math.round((Date.parse(e.date+'T12:00:00Z')-Date.parse(today+'T12:00:00Z'))/86400000),step=days<0?'overdue':String(days),channel=['bill','subscription','recurring'].includes(e.source)?e.source:'movement';if(!NOTICE_STEPS.some(x=>x[0]===step))return;items.push({id:'due:'+e.id+':'+step,title:e.title,text:(days<0?'Overdue':days===0?'Due today':'Due in '+days+' day'+(days===1?'':'s'))+' · '+fmt(e.amount),date:e.date,type:'event',eventId:e.id,channel,step})});const f=E.forecast(state,state.settings.horizon);if(f.negative)items.push({id:'shortfall:'+f.negative.date,title:'Potential cash shortfall',text:fmt(f.negative.balance)+' projected on '+date(f.negative.date,true),date:f.negative.date,type:'date',channel:'cash'});if(state.settings.buffer!==null){const p=f.points.find(p=>p.balance<state.settings.buffer);if(p)items.push({id:'buffer:'+p.date+':'+state.settings.buffer,title:'Below your cash buffer',text:fmt(p.balance)+' projected on '+date(p.date,true),date:p.date,type:'date',channel:'cash'})}const last=state.settings.lastBackup?.slice(0,10);if(state.transactions.length&&(!last||E.day(last,state.settings.backupDays)<=today))items.push({id:'backup:'+(last||'first'),title:'Keep a backup copy',text:'A portable backup protects against cleared browser storage.',type:'backup',channel:'backup'});if(state.accounts.length&&!state.snapshots.some(s=>s.createdAt.slice(0,7)===today.slice(0,7)))items.push({id:'review:'+today.slice(0,7),title:'Review and save your forecast',text:'Freeze this month’s assumptions for a future comparison.',type:'snapshot',channel:'review'});return items}
function notifications(){if(security&&!unlocked)return[];return notificationCandidates().filter(n=>n.channel!=='backup').filter(n=>{const p=notificationPref(n.channel);return p.enabled&&!p.hidden.includes(n.id)&&(!n.step||p.steps.includes(n.step))}).map(n=>({...n,...state.notifications.find(x=>x.id===n.id)}))}
async function toggleNotificationType(key){if(!NOTIFY_TYPES.some(x=>x[0]===key))return;const p=notificationPref(key),ids=notificationCandidates().filter(n=>n.channel===key).map(n=>n.id);await save(s=>{s.settings.notificationPrefs=s.settings.notificationPrefs||{};s.settings.notificationPrefs[key]={...p,enabled:!p.enabled,hidden:[...new Set([...p.hidden,...ids])]};},'Notification preferences saved')}
async function changeNotificationStep(key,step,checked){if(!NOTIFY_TYPES.some(x=>x[0]===key)||!NOTICE_STEPS.some(x=>x[0]===step))return;const p=notificationPref(key);await save(s=>{s.settings.notificationPrefs=s.settings.notificationPrefs||{};s.settings.notificationPrefs[key]={...p,steps:checked?[...new Set([...p.steps,step])]:p.steps.filter(x=>x!==step)}},'Notification preferences saved')}

function getEvent(id){let max=E.day(E.today(),Math.max(180,state.settings.generationDays));const occurrenceDate=id.split(':').pop();if(E.validDate(occurrenceDate)&&occurrenceDate>max)max=occurrenceDate;const movement=state.movements.find(m=>m.id===id);if(movement?.date>max)max=movement.date;return E.events(state,max).find(e=>e.id===id)}

Record actual movement':isTransfer?'Transfer money':direction==='in'?'Add inflow':'Add outflow','movement',fields,occ?'Expected '+fmt(occ.amount)+' on '+date(occ.date)+'. Recording replaces this occurrence’s forecast effect.':isTransfer?'Transfers between your accounts are not earned income or consumption spending.':'Expected entries affect your forecast; actual entries affect account balances.','data-direction="'+direction+'" data-id="'+(existing?.id||'')+'" data-occurrence="'+esc(occ?.id||existing?.occurrenceId||'')+'" data-actual="'+actual+'"',actual?'Record / save actual':'Save movement');if(occ&&['bill','subscription','recurring'].includes(occ.source)){$('overlay').querySelector('.form-grid').insertAdjacentHTML('beforeend','<div class="field full">'+check('useNext','Use this actual amount for future unpaid occurrences',false)+'</div>')}if(existing||occ){const mode=$('f-mode');mode.disabled=true}}

function definitionForm(kind='bill',id=''){const d=state.definitions.find(x=>x.id===id);const fields=input('title',(kind==='bill'?'Bill name':kind==='subscription'?'Service name':'Movement name')+'*',d?.title||'','text',true)+input('amount','Expected amount*',d?plain(d.amount):'','text',true)+select('direction','Direction',kind==='recurring'?[['in','Money in'],['out','Money out'],['transfer','Transfer']]:[['out','Money out']],d?.direction||'out')+select('frequency','Frequency',Object.entries(FREQ),d?.frequency||'monthly')+input('anchor',kind==='subscription'?'First / next paid billing date*':'First / next due date*',d?.anchor||E.today(),'date',true)+input('endDate','End date (optional)',d?.endDate||'','date')+select('categoryId','Category',categoryOptions(d?.direction||'out',d?.categoryId),d?.categoryId||'')+select('accountId','Account',accountOptions(),d?.accountId||'')+(kind==='recurring'?select('toAccountId','Transfer destination (if transfer)',accountOptions(),d?.toAccountId||''):'')+(kind==='subscription'?select('trial','Free trial',[['none','No trial'],['1','1 month'],['3','3 months'],['custom','Custom end date']],d?.trialEnd?'custom':'none')+input('trialStart','Subscription / trial start',d?.trialStart||E.today(),'date')+input('trialEnd','Trial end (custom)',d?.trialEnd||'','date'):'')+input('notes','Notes',d?.notes||'');form(d?'Edit '+kind:'Add '+kind,'definition',fields,d?'Edits apply prospectively. Paid history and saved snapshots stay unchanged. Changes to the schedule require a next date today or later.':'A schedule creates expected occurrences. It never records a payment automatically.','data-kind="'+kind+'" data-id="'+id+'"');if((d?.direction||'out')==='transfer')refreshEntryDirection('transfer')}
function editEvent(id){const e=getEvent(id);if(!e)return toast('That occurrence is no longer available.');if(e.actual)return movementForm(e.actual.direction,true,e.actual);form('Edit one occurrence','event',input('title','Description*',e.title,'text',true)+input('amount','Expected amount*',plain(e.amount),'text',true)+input('date','Expected date*',e.date,'date',true)+select('accountId','Account',accountOptions(),e.accountId||'')+(e.direction==='transfer'?select('toAccountId','Destination account',accountOptions(false),e.toAccountId||''):'')+select('categoryId','Category',categoryOptions(e.direction,e.categoryId),e.categoryId||'')+'<div class="field full">'+check('stillExpected','This overdue inflow is still expected',e.stillExpected)+'</div>'+input('notes','Notes',e.notes||''),'This changes only the selected occurrence, not the recurring schedule or actual cash.','data-id="'+esc(id)+'"');if(e.source==='movement')$('overlay').querySelector('.form-actions').insertAdjacentHTML('afterbegin',btn('Delete expected item','delete-movement','danger','data-id="'+e.id+'"'))}

function dayAgenda(d){const es=E.events(state,d).filter(e=>e.date===d&&!e.actual&&!e.skipped),ts=state.transactions.filter(t=>t.date===d);let balance;if(d>=E.today()){const f=E.forecast(state,d);balance='<div class="notice">Projected closing cash: <strong>'+fmt(f.closing)+'</strong></div>'}else{const known=E.poolIds(state).every(id=>state.accounts.find(a=>a.id===id).startDate<=d);balance='<div class="notice">'+(known?'Recorded closing cash: '+fmt(E.cash(state,d)):'Historical closing cash unavailable before an included account’s starting date.')+'</div>'}openModal(date(d),balance+'<h3 class="gap">Expected movements</h3>'+ (es.map(e=>calendarEntry(e)).join('')||'<div class="empty">No expected movements on this date.</div>')+'<h3 class="gap">Actual movements</h3>'+(ts.map(t=>calendarEntry({...t,actual:t})).join('')||'<div class="empty">No actual movements on this date.</div>'),'Daily cash agenda',true)}
function snapshotForm(){const selected=route==='dashboard'?state.settings.dashboardHorizon:route==='plan'&&tab==='Current Forecast'?'month':tab.includes('-Day')?tab.split('-')[0]:horizon;form('Save forecast snapshot','snapshot',input('name','Snapshot name*','Forecast · '+date(E.today(),true),'text',true)+select('horizon','Forecast horizon',[['month','Month end'],['30','30 days'],['60','60 days'],['90','90 days']],selected),'The full event assumptions and account selection will be frozen. Later changes will not rewrite this snapshot.','','Save snapshot')}
function viewSnapshot(id){const sn=state.snapshots.find(x=>x.id===id);const newActuals=state.transactions.filter(t=>t.date>=sn.start&&t.date<=sn.end&&!(sn.transactionsAtSnapshot||[]).includes(t.id)&&t.kind!=='adjustment');const actualIn=newActuals.reduce((n,t)=>n+Math.max(0,E.effect(state,t,sn.poolIds)),0),actualOut=newActuals.reduce((n,t)=>n+Math.max(0,-E.effect(state,t,sn.poolIds)),0);const known=sn.poolIds.every(id=>state.accounts.find(a=>a.id===id)?.startDate<=sn.start);let actualLow=null;if(known){for(let d=sn.start;d<=sn.end&&d<=E.today();d=E.day(d,1)){const b=E.cash(state,d,sn.poolIds);if(!actualLow||b<actualLow.balance)actualLow={date:d,balance:b}}}const comparison='<div class="metric-list gap">'+[['Saved expected inflows',fmt(sn.inflows)],['Actual inflows recorded since snapshot',fmt(actualIn)],['Saved expected outflows',fmt(sn.outflows)],['Actual outflows recorded since snapshot',fmt(actualOut)],['Actual lowest closing cash so far',actualLow?fmt(actualLow.balance)+' · '+date(actualLow.date,true):'Unavailable']].map(x=>'<div class="row"><span class="small">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div>';const rows=sn.events.map(e=>{const t=state.transactions.find(t=>t.occurrenceId===e.id);return '<div class="row"><div class="row-copy"><div class="row-title">'+esc(e.title)+'</div><div class="row-sub">Expected '+date(e.date,true)+' · '+fmt(e.amount)+'</div></div><div class="row-end"><div class="amount">'+(t?fmt(t.amount):'Not recorded')+'</div><div class="row-sub">'+(t?'Amount variance '+fmt(t.amount-e.amount)+' · actual '+date(t.date,true):'Expected only')+'</div></div></div>'}).join('');openModal(esc(sn.name),'<div class="notice">Saved '+new Date(sn.createdAt).toLocaleString(state.settings.language||'en')+'. Period '+date(sn.start)+' – '+date(sn.end)+'. Opening cash '+fmt(sn.opening)+'. Projected closing '+fmt(sn.closing)+'.</div>'+comparison+chart(sn)+rows+'<div class="actions gap">'+btn('Export snapshot CSV','export','','data-kind="snap function scenarioChange(mode='add'){const sn=state.scenarios.find(s=>s.id===scenarioId);if(!sn)return;const events=E.forecast(state,horizon).events;let fields=select('action','What would you like to try?',[['add','Add a new inflow or outflow'],['edit','Change an existing amount or date'],['skip','Leave out one expected event']],mode);if(mode==='add')fields+=input('title','Description*','','text',true)+select('direction','Direction',[['in','Inflow'],['out','Outflow']],'out')+input('amount','Amount*','','text',true)+input('date','Expected date*',E.today(),'date',true)+select('accountId','Account',accountOptions(),'');else{fields+=select('target','Expected event',[['','Select an event'],...events.map(e=>[e.id,e.title+' · '+date(e.date,true)])]);if(mode==='edit')fields+=input('amount','New amount (optional)','','text',false,'Leave blank to keep the original amount.')+input('date','New date (optional)','','date',false,'Leave blank to keep the original date.')}form('Add a what-if change','scenario-change',fields,mode==='skip'?'Only this occurrence is left out of the scenario. The real schedule is unchanged.':'Changes stay inside this scenario until you explicitly add them to your real plan.','','Save scenario change')}

function download(filename,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backupPayload(s=state){requireUnlocked();if(S.hasCredentials(S.cleanWorkspace(s)))throw Error('Workspace contains unexpected security fields. Backup was not created.');return {appName:'LedgerBloom Cash Flow Planner',schemaVersion:1,createdAt:new Date().toISOString(),data:S.cleanWorkspace(s)}}
async function backup(){download('LedgerBloom-Backup-'+E.today()+'.json',JSON.stringify(backupPayload(),null,2));await save(s=>s.settings.lastBackup=new Date().toISOString(),'Backup downloaded. Keep it somewhere safe.')}
function csvCell(x){let s=String(x??'');if(/^[=+@\-]/.test(s)&&!/^[-+]?\d+(\.\d+)?$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(kind,id=''){if(kind==='all'){exportAllCSV();return}let rows,header;const tx=state.transactions.filter(match);if(['transactions','inflows','outflows'].includes(kind)){header=['Date','Type','Description','Category','Amount','Account','Destination','Cash flow effect','Expected amount','Expected date','Source occurrence','Notes'];rows=tx.filter(t=>kind==='transactions'||t.direction===(kind==='inflows'?'in':'out')).map(t=>[t.date,t.kind,t.title,category(t.categoryId),plain(t.amount),name(t.accountId),t.toAccountId?name(t.toAccountId):'',plain(E.effect(state,t)),t.expectedAmount===null?'':plain(t.expectedAmount),t.expectedDate,t.occurrenceId,t.notes])}else if(kind==='accounts'){header=['Name','Type','Starting date','Starting balance','Current balance','In cash pool','Archived'];rows=state.accounts.map(a=>[a.name,a.type,a.startDate,plain(a.opening),plain(E.balance(state,a.id)),a.include,a.archived||false])}else if(['bill','subscription','recurring'].includes(kind)){header=['Name','Amount','Frequency','Anchor date','Status','Account','Category','Trial end'];rows=state.definitions.filter(d=>d.kind===kind).map(d=>[d.title,plain(d.amount),FREQ[d.frequency],d.anchor,d.status,name(d.accountId),category(d.categoryId),d.trialEnd||''])}else{const f=kind==='snapshot'?state.snapshots.find(s=>s.id===id):E.forecast(state,route==='dashboard'?state.settings.dashboardHorizon:route==='plan'&&tab==='Current Forecast'?'month':tab.includes('-Day')?tab.split('-')[0]:horizon);header=['Date','Description','Direction','Type','Expected amount','Actual amount','Status','Cash effect','Projected balance'];rows=f.events.map(e=>{const t=state.transactions.find(t=>t.occurrenceId===e.id);return [e.date,e.title,e.direction,e.source,plain(e.amount),t?plain(t.amount):'',t?'Fulfilled':'Expected',plain(e.effect),plain(e.balance)]})}download('LedgerBloom-'+kind+'-'+E.today()+'.csv','\uFEFF'+[header,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported')}
function renderLock(){closeModal();$('toast').innerHTML='';applyTheme();const recovering=lockMode==='recovery';$('app').innerHTML='<div class="security-lock-shell"><section class="card security-lock-card"><div class="security-brand">'+icon('shield')+'</div><div class="eyebrow">Cash Flow Planner</div><h1>Your private workspace.</h1><p class="subtitle">'+(recovering?'Use your saved recovery key to unlock the app.':'Enter your PIN to pick up where you left off.')+'</p><form data-form="'+(recovering?'recover':'unlock')+'">'+(recovering?credentialInput('key','Recovery Key',false):pinInput('pin','PIN',false))+'<button class="btn primary">Unlock Workspace</button></form>'+btn(recovering?'Use PIN Instead':'Forgot Your PIN?',recovering?'use-pin':'recover','text')+(recovering?'<div class="notice gap">No PIN or recovery key? Reset this app and restore a financial backup. Existing data will be deleted.</div>'+btn('Reset Locked App','locked-reset','danger gap'):'')+'<div id="form-error" class="error" role="alert"></div></section></div>';localizeUI($('app'));setTimeout(()=>$('app').querySelector('input')?.focus(),20)}
function requireUnlocked(){if(security&&!unlocked)throw Error('Unlock your workspace first.')}

function announceSecurity(){securityChannel?.postMessage({type:'security-changed'})}
async function syncSecurity(){const next=await S.read(db);if(securitySignature(next)!==securitySignature(security)){security=next;unlocked=!next;lockMode='pin';closeModal();state=await readState();render()}else security=next}
function setupSecuritySync(){if(typeof BroadcastChannel!=='undefined'){securityChannel=new BroadcastChannel('ledgerbloom-demo-cash-flow-security-v2');securityChannel.onmessage=()=>{if(!securityBusy)syncSecurity().catch(()=>lockNow())}}}
async function securityTask(task){if(securityBusy)return;securityBusy=true;try{return await task()}finally{securityBusy=false}}

function pinForm(){requireUnlocked();S.requireCrypto();form(security?'Change PIN':'Set Up PIN','pin',(security?credentialInput('current','Current PIN or Recovery Key'):'')+pinInput('pin','New PIN')+pinInput('confirm','Confirm New PIN'),'A new recovery key will be shown once. Any previous recovery key will stop working.','',security?'Change PIN':'Enable PIN')}

const FORMS={
